<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Student</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f7fa;color:#243449;margin:0;padding:35px}.box{max-width:520px;margin:40px auto;background:white;padding:28px;border-radius:14px;border:1px solid #e5eaf0}h1{font-size:23px}.muted{color:#718096;font-size:13px}label{display:block;margin:18px 0 7px;font-size:13px}input{width:100%;padding:12px;border:1px solid #d5dde7;border-radius:8px;box-sizing:border-box}.btn{display:inline-block;margin-top:20px;padding:11px 16px;background:#315f9e;color:white;border:0;border-radius:8px;text-decoration:none;cursor:pointer}.back{background:#edf3fa;color:#315f9e;margin-left:7px}
</style></head>
<body><div class="box"><h1>Edit student</h1><p class="muted">Update the student's name. Subject marks can be changed in the dashboard.</p>
<form method="post"><label>Student name</label><input name="name" value="{{ student.name }}" required><button class="btn" type="submit">Save changes</button><a class="btn back" href="{{ url_for('home') }}">Cancel</a></form></div></body></html>
