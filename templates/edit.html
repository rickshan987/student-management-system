
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            padding: 30px 15px;
            color: #1e293b;
        }

        .panel {
            max-width: 450px;
            margin: 40px auto;
            background: white;
            padding: 28px;
            border-radius: 14px;
            box-shadow: 0 3px 12px #0f172a12;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin: 10px 0 18px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
        }

        button, a {
            display: inline-block;
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            cursor: pointer;
        }

        a { background: #64748b; }
    </style>
</head>

<body>
    <div class="panel">
        <h1>Edit Student</h1>

        <form method="POST">
            <label>Student Name</label>
            <input type="text" name="name"
                   value="{{ student.name }}" required>

            <label>Marks (0-100)</label>
            <input type="number" name="marks"
                   value="{{ student.marks }}"
                   min="0" max="100" step="any" required>

            <button type="submit">Save Changes</button>
            <a href="/">Cancel</a>
        </form>
    </div>
</body>
</html>
